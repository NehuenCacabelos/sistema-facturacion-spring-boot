<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/layout :: head}"></head>
<body>

    <header th:replace="~{layout/layout :: header}"></header>

    <div class="container py-4">
        <div class="card shadow-sm border-0 mb-4">
            <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
                <h4 class="mb-0" th:text="${titulo != null ? titulo : 'Vista de cliente'}">Vista de cliente</h4>
                <a th:href="@{/listar}" class="btn btn-light btn-sm">
                    <i class="bi bi-arrow-left"></i> Volver al listado
                </a>
            </div>
            <div class="card-body">

                <div class="row align-items-center mb-4">
                    <!-- Foto según especificación de cátedra (pág. 5) -->
                    <div class="col-md-3 text-center mb-3 mb-md-0">
                        <img th:if="${cliente.foto != null and #strings.length(cliente.foto) > 0}"
                             th:src="@{'/uploads/' + ${cliente.foto}}"
                             th:alt="${cliente.foto}"
                             class="img-thumbnail rounded shadow-sm" style="max-height: 200px; max-width: 100%;" />
                        <div th:if="${cliente.foto == null or #strings.isEmpty(cliente.foto)}"
                             class="bg-light p-4 rounded text-muted">
                            <i class="bi bi-person-circle display-4 d-block mb-2"></i>
                            <span>Sin foto</span>
                        </div>
                    </div>

                    <div class="col-md-9">
                        <ul class="list-group list-group-flush">
                            <li class="list-group-item"><strong>ID:</strong> <span th:text="${cliente.id}"></span></li>
                            <li class="list-group-item"><strong>Nombre:</strong> <span th:text="${cliente.nombre}"></span></li>
                            <li class="list-group-item"><strong>Apellido:</strong> <span th:text="${cliente.apellido}"></span></li>
                            <li class="list-group-item"><strong>Email:</strong> <span th:text="${cliente.email}"></span></li>
                            <li class="list-group-item"><strong>Fecha:</strong> <span th:text="${cliente.createAt}"></span></li>
                        </ul>
                    </div>
                </div>

                <div class="d-flex justify-content-between align-items-center mt-4 mb-3 border-bottom pb-2">
                    <h5 class="mb-0 text-secondary">
                        <i class="bi bi-receipt"></i> Facturas
                    </h5>
                    <a th:href="@{'/nuevafactura/' + ${cliente.id}}" class="btn btn-success btn-sm">
                        <i class="bi bi-plus-circle"></i> Nueva factura
                    </a>
                </div>

                <div class="alert alert-info" th:if="${#lists.isEmpty(facturas)}">
                    <i class="bi bi-info-circle"></i> No hay facturas para este cliente todavía.
                </div>

                <div class="table-responsive" th:if="${not #lists.isEmpty(facturas)}">
                    <table class="table table-bordered table-striped table-hover align-middle">
                        <thead class="table-secondary">
                            <tr>
                                <th># Factura</th>
                                <th>Descripción</th>
                                <th>Fecha</th>
                                <th class="text-end">Importe</th>
                                <th class="text-center">Ver</th>
                                <th class="text-center">Eliminar</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="factura : ${facturas}">
                                <td th:text="${factura.id}">1</td>
                                <td th:text="${factura.descripcion}">Compra de insumos</td>
                                <td th:text="${factura.createAt}">2023-01-01</td>
                                <td class="text-end fw-bold text-success"
                                    th:text="'$' + ${#numbers.formatDecimal(factura.total, 1, 'POINT', 2, 'COMMA')}">
                                    $0.00
                                </td>
                                <td class="text-center">
                                    <a th:href="@{'/facturas/' + ${factura.id}}" class="btn btn-primary btn-sm" title="Ver detalle">
                                        <i class="bi bi-eye"></i> Ver
                                    </a>
                                </td>
                                <td class="text-center">
                                    <a th:href="@{'/factura/eliminar/' + ${factura.id}}" class="btn btn-danger btn-sm"
                                       onclick="return confirm('¿Está seguro de eliminar esta factura?');" title="Eliminar">
                                        <i class="bi bi-trash"></i> Eliminar
                                    </a>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>

            </div>
        </div>
    </div>

    <footer th:replace="~{layout/layout :: footer}"></footer>

</body>
</html>
