<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/layout :: head}"></head>
<body>

    <header th:replace="~{layout/layout :: header}"></header>

    <div class="container py-4">
        <div class="card shadow-sm border-0">
            <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
                <h4 class="mb-0" th:text="${titulo}">Clientes</h4>
                <a th:href="@{/form}" class="btn btn-success btn-sm">
                    <i class="bi bi-person-plus-fill"></i> Crear cliente
                </a>
            </div>
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-striped table-hover align-middle">
                        <thead class="table-dark">
                            <tr>
                                <th>Id</th>
                                <th>Nombre</th>
                                <th>Apellido</th>
                                <th>Email</th>
                                <th>Fecha</th>
                                <th class="text-center">Crear factura</th>
                                <th class="text-center">Ver</th>
                                <th class="text-center">Eliminar</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="cliente : ${lista}">
                                <td th:text="${cliente.id}">1</td>
                                <td th:text="${cliente.nombre}">Nombre</td>
                                <td th:text="${cliente.apellido}">Apellido</td>
                                <td th:text="${cliente.email}">correo@dominio.com</td>
                                <td th:text="${cliente.createAt}">2023-01-01</td>
                                <td class="text-center">
                                    <a class="btn btn-success btn-sm" th:href="@{'/nuevafactura/' + ${cliente.id}}">
                                        Crear factura
                                    </a>
                                </td>
                                <td class="text-center">
                                    <a class="btn btn-primary btn-sm" th:href="@{'/ver/' + ${cliente.id}}">
                                        Ver
                                    </a>
                                </td>
                                <td class="text-center">
                                    <a class="btn btn-danger btn-sm" th:href="@{'/eliminar/' + ${cliente.id}}"
                                       onclick="return confirm('¿Está seguro de que desea eliminar este cliente?');">
                                        Eliminar
                                    </a>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>


            </div>
        </div>
    </div>

    <footer th:replace="~{layout/layout :: footer}"></footer>

</body>
</html>
