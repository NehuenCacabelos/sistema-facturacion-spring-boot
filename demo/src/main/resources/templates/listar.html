<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/layout :: head}"></head>
<body>

    <header th:replace="~{layout/layout :: header}"></header>

    <div class="container py-4">
        <div class="card shadow-sm border-0">
            <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
                <h4 class="mb-0" th:text="${titulo}">Clientes</h4>
                <a th:href="@{/form}" class="btn btn-light btn-sm">
                    <i class="bi bi-person-plus-fill"></i> Crear Cliente
                </a>
            </div>
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-striped table-hover align-middle">
                        <thead class="table-dark">
                            <tr>
                                <th># ID</th>
                                <th>Nombre</th>
                                <th>Apellido</th>
                                <th>Email</th>
                                <th>Fecha Alta</th>
                                <th class="text-center">Crear Factura</th>
                                <th class="text-center">Acciones</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="cliente : ${lista}">
                                <td th:text="${cliente.id}">1</td>
                                <td>
                                    <a th:href="@{'/ver/' + ${cliente.id}}" class="fw-semibold text-decoration-none" th:text="${cliente.nombre}"></a>
                                </td>
                                <td th:text="${cliente.apellido}">Pérez</td>
                                <td th:text="${cliente.email}">correo@dominio.com</td>
                                <td th:text="${cliente.createAt}">2023-01-01</td>
                                <td class="text-center">
                                    <a class="btn btn-success btn-sm" th:href="@{'/factura/form/' + ${cliente.id}}" title="Crear Factura">
                                        <i class="bi bi-receipt"></i> Nueva Factura
                                    </a>
                                </td>
                                <td class="text-center">
                                    <div class="btn-group" role="group">
                                        <a class="btn btn-outline-info btn-sm" th:href="@{'/ver/' + ${cliente.id}}" title="Ver detalle">
                                            <i class="bi bi-eye"></i>
                                        </a>
                                        <a class="btn btn-outline-warning btn-sm" th:href="@{'/form/' + ${cliente.id}}" title="Editar">
                                            <i class="bi bi-pencil"></i>
                                        </a>
                                        <a class="btn btn-outline-danger btn-sm" th:href="@{'/eliminar/' + ${cliente.id}}"
                                           onclick="return confirm('¿Está seguro de que desea eliminar este cliente y todas sus facturas?');" title="Eliminar">
                                            <i class="bi bi-trash"></i>
                                        </a>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <!-- Paginator -->
                <div class="mt-3" th:if="${page != null}" th:replace="~{layout/layout :: paginator}"></div>

            </div>
        </div>
    </div>

    <footer th:replace="~{layout/layout :: footer}"></footer>

</body>
</html>
