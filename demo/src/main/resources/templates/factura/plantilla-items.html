<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

    <table th:fragment="itemsFactura" class="d-none">
        <tbody id="plantillaItemsFactura">
            <tr id="row_{ID}">
                <td class="d-none">
                    <input type="hidden" value="{ID}" name="item_id[]" />
                </td>
                <td class="align-middle fw-semibold">{NOMBRE}</td>
                <td class="align-middle text-end">{PRECIO}</td>
                <td class="align-middle" style="width: 130px;">
                    <input type="number" value="1" name="cantidad[]" id="cantidad_{ID}"
                           class="form-control form-control-sm text-center" min="1"
                           onchange="itemsHelper.calcularImporte({ID}, {PRECIO}, this.value);" />
                </td>
                <td class="align-middle text-end fw-bold text-success">
                    $<span id="total_importe_{ID}">{PRECIO}</span>
                </td>
                <td class="align-middle text-center">
                    <button type="button" class="btn btn-outline-danger btn-sm"
                            onclick="itemsHelper.eliminarLineaFactura({ID});">
                        <i class="bi bi-x-lg"></i>
                    </button>
                </td>
            </tr>
        </tbody>
    </table>

</body>
</html>
