<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/layout :: head}"></head>
<body>

    <header th:replace="~{layout/layout :: header}"></header>

    <div class="container py-4">
        <div class="card shadow-sm border-0 col-lg-8 mx-auto">
            <div class="card-header bg-primary text-white">
                <h4 class="mb-0" th:text="${titulo}">Formulario de Cliente</h4>
            </div>
            <div class="card-body">

                <form th:action="@{/form}" th:object="${cliente}" method="post" enctype="multipart/form-data">

                    <input type="hidden" th:field="*{id}" />

                    <div class="mb-3 row">
                        <label for="nombre" class="col-sm-3 col-form-label">Nombre</label>
                        <div class="col-sm-9">
                            <input type="text" th:field="*{nombre}" class="form-control"
                                   th:errorclass="'form-control is-invalid'" placeholder="Nombre del cliente" />
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></div>
                        </div>
                    </div>

                    <div class="mb-3 row">
                        <label for="apellido" class="col-sm-3 col-form-label">Apellido</label>
                        <div class="col-sm-9">
                            <input type="text" th:field="*{apellido}" class="form-control"
                                   th:errorclass="'form-control is-invalid'" placeholder="Apellido del cliente" />
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('apellido')}" th:errors="*{apellido}"></div>
                        </div>
                    </div>

                    <div class="mb-3 row">
                        <label for="email" class="col-sm-3 col-form-label">Email</label>
                        <div class="col-sm-9">
                            <input type="email" th:field="*{email}" class="form-control"
                                   th:errorclass="'form-control is-invalid'" placeholder="ejemplo@correo.com" />
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                        </div>
                    </div>

                    <div class="mb-3 row">
                        <label for="createAt" class="col-sm-3 col-form-label">Fecha de Alta</label>
                        <div class="col-sm-9">
                            <input type="date" th:field="*{createAt}" class="form-control"
                                   th:errorclass="'form-control is-invalid'" />
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('createAt')}" th:errors="*{createAt}"></div>
                        </div>
                    </div>

                    <div class="mb-3 row">
                        <label for="file" class="col-sm-3 col-form-label">Foto de Perfil</label>
                        <div class="col-sm-9">
                            <input type="file" name="file" class="form-control" accept="image/*" />
                            <div class="form-text">Formatos sugeridos: JPG, PNG, WebP (máx. 10MB).</div>
                        </div>
                    </div>

                    <div class="d-flex justify-content-end gap-2 mt-4">
                        <a th:href="@{/listar}" class="btn btn-secondary">
                            <i class="bi bi-arrow-left"></i> Cancelar
                        </a>
                        <button type="submit" class="btn btn-success">
                            <i class="bi bi-check2-circle"></i> Guardar Cliente
                        </button>
                    </div>

                </form>

            </div>
        </div>
    </div>

    <footer th:replace="~{layout/layout :: footer}"></footer>

</body>
</html>
